<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prumo</title>
<meta name="description" content="Anote gastos, compromissos e tarefas falando normal. Funciona sem internet, os dados ficam no seu aparelho.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prumo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<link rel="icon" href="icones/icone-192.png">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<header class="topo">
  <div class="topo-linha">
    <div class="marca-bloco">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 3.5h9M12 3.5v6"/><path d="M12 9.5l3.4 3.6L12 21l-3.4-7.9z" fill="#fff"/></svg>
      </div>
      <div>
        <div class="marca">Prumo</div>
        <div class="data-hoje" id="dataHoje"></div>
      </div>
    </div>
    <button class="icone-botao" id="btAjuda" aria-label="Como usar o Prumo" title="Como usar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.2"/><path d="M9.4 9.3a2.7 2.7 0 0 1 5.2.9c0 1.8-2.6 2.3-2.6 3.9"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
    </button>
    <button class="icone-botao" id="btBusca" aria-label="Buscar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    </button>
    <button class="icone-botao" id="btAjustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.54 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.54a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/></svg>
    </button>
  </div>

  <form class="entrada" id="formEntrada" autocomplete="off">
    <input id="campoEntrada" type="text" enterkeyhint="done" autocapitalize="sentences"
           autocorrect="on" spellcheck="false"
           placeholder="Escreva ou fale…">
    <button type="button" class="voz" id="btVoz" aria-label="Falar" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    </button>
    <button type="submit" class="enviar" aria-label="Anotar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
    </button>
  </form>

  <div id="sugestoes" hidden></div>

  <div class="entrada" id="linhaBusca" hidden>
    <span class="lupa"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></span>
    <input id="campoBusca" type="search" enterkeyhint="search" placeholder="Procurar em tudo…">
  </div>

  <div id="confirma"></div>
</header>

<main id="conteudo"></main>

<nav class="abas">
  <button class="aba ativa" data-aba="hoje"><span class="aba-icone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
    Hoje
  </button>
  <button class="aba" data-aba="dinheiro"><span class="aba-icone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2.5"/><path d="M2 10.5h20"/><circle cx="17" cy="15" r="1.3"/></svg></span>
    Dinheiro
  </button>
  <button class="aba" data-aba="agenda"><span class="aba-icone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
    Agenda
  </button>
  <button class="aba" data-aba="tarefas"><span class="aba-icone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 12.5l2.8 2.8L16.5 9.6"/></svg></span>
    Tarefas
  </button>
</nav>

<div id="painel"></div>

<script src="versao-miolo.js"></script>
<script src="miolo.js"></script>
<script src="interpretador.js"></script>
<script src="dados.js"></script>
<script src="calendario.js"></script>
<script src="avisos.js"></script>
<script src="tutorial.js"></script>
<script src="atualizacao.js"></script>
<script src="esfera.js"></script>
<script src="app.js"></script>
</body>
</html>
