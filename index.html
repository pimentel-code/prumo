<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prumo</title>
<meta name="description" content="Anote gastos, compromissos e tarefas falando normal. Funciona sem internet, os dados ficam no seu aparelho.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1316" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prumo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<link rel="icon" href="icones/icone-192.png">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<header class="topo">
  <div class="topo-linha">
    <div class="marca">Pru<span>mo</span></div>
    <button class="icone-botao" id="btBusca" aria-label="Buscar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    </button>
    <button class="icone-botao" id="btAjustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.54 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.54a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/></svg>
    </button>
  </div>

  <form class="entrada" id="formEntrada" autocomplete="off">
    <input id="campoEntrada" type="text" enterkeyhint="done" autocapitalize="sentences"
           autocorrect="on" spellcheck="false"
           placeholder="O que aconteceu? Fale ou escreva…">
    <button type="submit">Anotar</button>
  </form>

  <div class="entrada" id="linhaBusca" hidden>
    <input id="campoBusca" type="search" enterkeyhint="search" placeholder="Procurar em tudo…">
  </div>

  <div id="confirma"></div>
</header>

<main id="conteudo"></main>

<nav class="abas">
  <button class="aba ativa" data-aba="hoje">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    Hoje
  </button>
  <button class="aba" data-aba="dinheiro">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2.5"/><path d="M2 10.5h20"/><circle cx="17" cy="15" r="1.3"/></svg>
    Dinheiro
  </button>
  <button class="aba" data-aba="agenda">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    Agenda
  </button>
  <button class="aba" data-aba="tarefas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 12.5l2.8 2.8L16.5 9.6"/></svg>
    Tarefas
  </button>
</nav>

<div id="painel"></div>

<script src="interpretador.js"></script>
<script src="dados.js"></script>
<script src="calendario.js"></script>
<script src="app.js"></script>
</body>
</html>
